name: Pruebas y ejecutables

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -v

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas del núcleo, APK y lint
        run: ./gradlew --no-daemon :core:test :app:assembleDebug :app:lintDebug
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BedrockLanProxy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockLanProxy-Android
          path: android/BedrockLanProxy.apk

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: BedrockLanProxy-Windows
          - os: macos-latest
            name: BedrockLanProxy-macOS
          - os: ubuntu-latest
            name: BedrockLanProxy-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name BedrockLanProxy run.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
