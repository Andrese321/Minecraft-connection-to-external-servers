name: Pruebas y ejecutables

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -v

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: BedrockLanProxy-Windows
          - os: macos-latest
            name: BedrockLanProxy-macOS
          - os: ubuntu-latest
            name: BedrockLanProxy-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name BedrockLanProxy run.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
