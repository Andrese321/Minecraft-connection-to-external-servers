name: Diagnóstico

# Se ejecuta a mano desde la pestaña Actions (tarda unos minutos por el emulador).
on:
  workflow_dispatch:
    inputs:
      servidor:
        description: "Servidor a comprobar (host:puerto)"
        default: "172.96.172.240:25776"

jobs:
  servidor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ¿Bedrock o Java?
        run: python tools/check_server.py "${{ github.event.inputs.servidor || '172.96.172.240:25776' }}"

  pantalla-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compilar pruebas
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Emulador Android 15 + prueba de desplazamiento
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: |
            adb logcat -G 16M || true
            adb logcat -c || true
            adb shell cmd uimode night yes || true
            adb shell settings put system font_scale 1.3 || true
            ./gradlew --no-daemon :app:connectedDebugAndroidTest || true
            adb logcat -d -s DIAG:I SHOT:I AndroidRuntime:E > diag.txt || true
            cat diag.txt
